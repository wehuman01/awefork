name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  release:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # package.json sets mac.identity: null, so electron-builder ships the
      # unsigned dmg without hunting for signing identities. GH_TOKEN is
      # deliberately absent here so electron-builder never tries to publish.
      - name: Build dmg
        run: npm run dist
      - name: Extract release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="## v${TAG}" '
            $0 == ver { found = 1; next }
            found && /^## v[0-9]/ { exit }
            found { print }
          ' docs/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for v${TAG}; failing." >&2
            exit 1
          fi
      - name: Create release with dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md dist/*.dmg
